name: Core Quick Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  wordpress-core:
    name: Core Quick Gate
    # This is genuine plain WordPress evidence, not API/Core or WooCommerce conformance.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check source distribution boundaries
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f yoro-ai-core.php
          grep -Fq '/.github export-ignore' .gitattributes
          grep -Fq '/tests export-ignore' .gitattributes
          # Exact package and staging operations use the local owner path.
          # Current required-context cutover is a separate Human action.

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: curl, fileinfo, mbstring, mysqli, zip

      - name: Run lightweight transport unit contracts
        shell: bash
        run: |
          set -euo pipefail
          php tests/unit/api-endpoint-resolver-test.php
          php tests/unit/api-connection-client-test.php
          php tests/unit/trace-context-test.php
          php tests/unit/connector-worker-session-test.php
          php tests/unit/connector-wake-test.php
          php tests/unit/connector-wake-client-test.php

      - name: Run media reference transport contract
        run: php tests/contracts/media-reference-transport-contract.php

      - name: Install disposable plain WordPress
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/wp-cli.phar" \
            https://raw.githubusercontent.com/wp-cli/builds/2f25af27dbcfc55ca8fe0efe65c7771a777234dc/phar/wp-cli.phar
          php "$RUNNER_TEMP/wp-cli.phar" core download https://wordpress.org/wordpress-7.1.zip \
            --path="$RUNNER_TEMP/wordpress" \
            --quiet
          php "$RUNNER_TEMP/wp-cli.phar" core verify-checksums --version=7.1 \
            --path="$RUNNER_TEMP/wordpress"
          php "$RUNNER_TEMP/wp-cli.phar" config create \
            --path="$RUNNER_TEMP/wordpress" \
            --dbname=wordpress \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          php "$RUNNER_TEMP/wp-cli.phar" core install \
            --path="$RUNNER_TEMP/wordpress" \
            --url=http://yoro-wordpress-smoke.test \
            --title="YoRo WordPress Smoke" \
            --admin_user=yoro_admin \
            --admin_password=yoro_smoke_password \
            --admin_email=smoke@example.test \
            --skip-email
          ln -s "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/wordpress/wp-content/plugins/yoro-ai-core"
          php "$RUNNER_TEMP/wp-cli.phar" plugin activate yoro-ai-core \
            --path="$RUNNER_TEMP/wordpress"
          wordpress_version="$(php "$RUNNER_TEMP/wp-cli.phar" core version --path="$RUNNER_TEMP/wordpress")"
          [[ "$wordpress_version" == '7.1' ]]
          echo "Verified WordPress $wordpress_version against WordPress.org checksums."

      - name: Run WordPress-first contract
        run: |
          php "$RUNNER_TEMP/wp-cli.phar" eval-file \
            "$GITHUB_WORKSPACE/tests/smoke/wordpress-core-runtime-contract.php" \
            --path="$RUNNER_TEMP/wordpress"
          php "$RUNNER_TEMP/wp-cli.phar" eval-file \
            "$GITHUB_WORKSPACE/tests/smoke/strict-output-validation-readiness-contract.php" \
            --path="$RUNNER_TEMP/wordpress"
          php "$RUNNER_TEMP/wp-cli.phar" eval-file \
            "$GITHUB_WORKSPACE/tests/smoke/early-access-wordpress-read-contract.php" \
            --path="$RUNNER_TEMP/wordpress"
