name: WordPress Smoke Contracts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-core:
    name: Plain WordPress Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify P2 distribution and release boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/.github export-ignore' .gitattributes
          grep -Fq '/tests export-ignore' .gitattributes
          grep -Fq '/yorohq-site export-ignore' .gitattributes
          grep -Fq 'permissions:' .github/workflows/release-candidate.yml
          grep -Fq '  contents: read' .github/workflows/release-candidate.yml
          grep -Fq 'production_authorized' .github/workflows/release-candidate.yml
          grep -Fq 'archive_listing="$root/archive-list.txt"' .github/workflows/release-candidate.yml
          ! grep -Fq 'unzip -Z1 "$root/yoro-ai-core-$SOURCE_SHA.zip" | grep' .github/workflows/release-candidate.yml
          ! grep -q 'secrets\.YORO_PRODUCTION_' .github/workflows/release-candidate.yml

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: curl, fileinfo, mbstring, mysqli, zip

      - name: Run lightweight transport unit contracts
        shell: bash
        run: |
          set -euo pipefail
          php tests/unit/api-endpoint-resolver-test.php
          php tests/unit/api-connection-client-test.php
          php tests/unit/trace-context-test.php

      - name: Run media reference transport contract
        run: php tests/contracts/media-reference-transport-contract.php

      - name: Install disposable plain WordPress
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/wp-cli.phar" \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php "$RUNNER_TEMP/wp-cli.phar" core download \
            --path="$RUNNER_TEMP/wordpress" \
            --quiet
          php "$RUNNER_TEMP/wp-cli.phar" config create \
            --path="$RUNNER_TEMP/wordpress" \
            --dbname=wordpress \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          php "$RUNNER_TEMP/wp-cli.phar" core install \
            --path="$RUNNER_TEMP/wordpress" \
            --url=http://yoro-wordpress-smoke.test \
            --title="YoRo WordPress Smoke" \
            --admin_user=yoro_admin \
            --admin_password=yoro_smoke_password \
            --admin_email=smoke@example.test \
            --skip-email
          ln -s "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/wordpress/wp-content/plugins/yoro-ai-core"
          php "$RUNNER_TEMP/wp-cli.phar" plugin activate yoro-ai-core \
            --path="$RUNNER_TEMP/wordpress"

      - name: Run WordPress-first contract
        run: |
          php "$RUNNER_TEMP/wp-cli.phar" eval-file \
            "$GITHUB_WORKSPACE/tests/smoke/wordpress-core-runtime-contract.php" \
            --path="$RUNNER_TEMP/wordpress"
          php "$RUNNER_TEMP/wp-cli.phar" eval-file \
            "$GITHUB_WORKSPACE/tests/smoke/strict-output-validation-readiness-contract.php" \
            --path="$RUNNER_TEMP/wordpress"

  smoke:
    name: WordPress and WooCommerce Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Require cross-repository read credential
        shell: bash
        env:
          YORO_CROSS_REPO_READ_TOKEN: ${{ secrets.YORO_CROSS_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$YORO_CROSS_REPO_READ_TOKEN" ]]; then
            echo "YORO_CROSS_REPO_READ_TOKEN is required for the latest API compatibility canary." >&2
            exit 1
          fi

      - name: Checkout latest shared YoRo API contracts canary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YoOhw-com/yoro-ai-api
          # This smoke workflow tracks the latest API contract owner as a canary.
          # Exact immutable API/Core compatibility proof remains separate.
          ref: main
          token: ${{ secrets.YORO_CROSS_REPO_READ_TOKEN }}
          path: _shared/yoro-ai-api
          persist-credentials: false

      - name: Record resolved API canary identity
        shell: bash
        run: |
          set -euo pipefail
          api_sha="$(git -C "$GITHUB_WORKSPACE/_shared/yoro-ai-api" rev-parse HEAD)"
          [[ "$api_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "Resolved YoOhw-com/yoro-ai-api@main canary SHA: $api_sha"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: curl, fileinfo, mbstring, mysqli, zip

      - name: Run lightweight transport unit contracts
        shell: bash
        run: |
          set -euo pipefail
          php tests/unit/api-endpoint-resolver-test.php
          php tests/unit/api-connection-client-test.php
          php tests/unit/trace-context-test.php

      - name: Install disposable WordPress and WooCommerce
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/wp-cli.phar" \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php "$RUNNER_TEMP/wp-cli.phar" core download \
            --path="$RUNNER_TEMP/wordpress" \
            --quiet
          php "$RUNNER_TEMP/wp-cli.phar" config create \
            --path="$RUNNER_TEMP/wordpress" \
            --dbname=wordpress \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          php "$RUNNER_TEMP/wp-cli.phar" core install \
            --path="$RUNNER_TEMP/wordpress" \
            --url=http://yoro-plugin-smoke.test \
            --title="YoRo Plugin Smoke" \
            --admin_user=yoro_admin \
            --admin_password=yoro_smoke_password \
            --admin_email=smoke@example.test \
            --skip-email
          php "$RUNNER_TEMP/wp-cli.phar" plugin install woocommerce \
            --path="$RUNNER_TEMP/wordpress" \
            --activate
          ln -s "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/wordpress/wp-content/plugins/yoro-ai-core"
          php "$RUNNER_TEMP/wp-cli.phar" plugin activate yoro-ai-core \
            --path="$RUNNER_TEMP/wordpress"

      - name: Run PHP smoke contracts
        env:
          YORO_SHARED_COMMERCE_FIXTURES: ${{ github.workspace }}/_shared/yoro-ai-api/resources/contracts/commerce/v1/canonical-fixtures.json
          YORO_SHARED_OPERATION_ENVELOPE_CASES: ${{ github.workspace }}/_shared/yoro-ai-api/resources/contracts/commerce/v1/operation-envelope-conformance.json
        run: |
          for contract in tests/smoke/*.php; do
            php "$RUNNER_TEMP/wp-cli.phar" eval-file "$GITHUB_WORKSPACE/$contract" \
              --path="$RUNNER_TEMP/wordpress"
          done

      - name: Run JavaScript smoke contracts
        run: |
          for contract in tests/smoke/*.js; do
            node "$contract"
          done
