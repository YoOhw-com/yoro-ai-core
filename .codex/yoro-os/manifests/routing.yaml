schema_version: "0.3"
document_type: yoro_task_routing
primary_task_classes:
  - discovery/report
  - documentation/governance
  - repository adoption
  - component-local feature
  - component-local bug fix
  - cross-repository contract
  - architecture
  - data/schema migration
  - security/auth/tenant
  - MCP change
  - release/readiness
  - incident/recovery
risk_flags:
  - read-only
  - mutation
  - public contract
  - cross-repository
  - credential
  - PII
  - authentication
  - authorization
  - tenant isolation
  - MCP
  - billing
  - customer communication
  - destructive/irreversible
  - mobile signing
  - connector cutover
capability_tiers:
  - high_reasoning
  - standard_implementation
  - efficient_read
global_stop_conditions:
  - classification_ambiguous
  - owner_controlled_change_would_be_overwritten
  - required_owner_unassigned
  - required_agent_unavailable
  - lower_capability_substitution_requested
  - secret_access_required
  - contract_compatibility_unproven_before_cross_repo_write
  - mutation_safety_unknown_before_mutation_write
  - protected_gate_bypass
  - execution_environment_write_scope_mismatch
selector_manifest: manifests/routing-selectors.yaml
concrete_agent_directory: .codex/agents
write_scope_semantics:
  agent_sandbox: capability assigned to a custom agent; not repository authorization
  candidate_write_scope: declared component repositories the task could write if all task-specific approvals and preconditions pass
  write_authorization_state: authorization state evaluated independently from the candidate repository set
  effective_write_scope: candidate repositories authorized for this concrete task; empty while protected approvals or adoption preconditions are unresolved
  artifact_write_scope: non-repository evidence outputs such as release_evidence; never a repository ID
  backward_compatible_write_scope: exactly equals effective_write_scope
  environment_boundary: filesystem/UI permission profile observed during preflight
  application_write_precondition: effective_write_scope must be a subset of the observed environment boundary; repository adoption additionally requires an exact single-target boundary
routes:
  discovery/report:
    discovery: full_in_scope_read_only
    planning_depth: concise
    repository_scope_policy: none
    agents: [coordinator, explorer_by_component]
    capability_tier: efficient_read
    tests: [evidence_link_validation]
    reviews: []
    recovery_evidence: not_applicable
    human_approvals: []
  documentation/governance:
    discovery: governance_and_referenced_runtime_evidence
    planning_depth: standard
    repository_scope_policy: fixed_governance_repository
    agents: [coordinator, implementer, test-runner, reviewer]
    capability_tier: standard_implementation
    tests: [governance_validators, deterministic_generation, link_validation]
    reviews: [independent_review]
    recovery_evidence: normal_git_revert
    human_approvals: [owner_for_policy_acceptance]
  repository adoption:
    discovery: target_managed_governance_paths_and_existing_component_instructions
    planning_depth: managed_preview_diff_install_and_rollback_plan
    repository_scope_policy: one_affected_component
    agents: [coordinator, explorer_by_component, implementer, test-runner, reviewer]
    capability_tier: standard_implementation
    tests: [managed_preview, managed_diff, installation_validation, deterministic_generation, install_check_install_idempotence, generated_drift, rollback_evidence, post_install_git_status]
    reviews: [independent_review]
    recovery_evidence: managed_state_rollback_snapshot
    human_approvals: [repository_adoption_authority]
  component-local feature:
    discovery: component_execution_path_and_contract_surface
    planning_depth: standard
    repository_scope_policy: one_affected_component
    agents: [coordinator, explorer_by_component, implementer, test-runner, reviewer]
    capability_tier: standard_implementation
    tests: [component_local_tests, changed_contract_projection_if_any]
    reviews: [independent_review]
    recovery_evidence: component_specific
    human_approvals: [product_owner_if_behavior_changes]
  component-local bug fix:
    discovery: reproduce_and_trace_component_path
    planning_depth: standard
    repository_scope_policy: one_affected_component
    agents: [coordinator, explorer_by_component, debugger, implementer, test-runner, reviewer]
    capability_tier: standard_implementation
    tests: [regression_test, component_local_tests]
    reviews: [independent_review]
    recovery_evidence: component_specific
    human_approvals: []
  cross-repository contract:
    discovery: producer_consumer_runtime_and_contract_evidence
    planning_depth: execution_plan_and_contract_lock
    repository_scope_policy: affected_components
    agents: [coordinator, explorers_for_all_components, architect, contract-auditor, implementer, test-runner, security-reviewer_if_flagged, reviewer]
    capability_tier: high_reasoning
    tests: [provider_tests, consumer_tests, compatibility_matrix, contract_lock_validation]
    reviews: [architecture_review, contract_review, independent_review]
    recovery_evidence: ordered_rollout_and_rollback
    human_approvals: [contract_owner, affected_component_owners]
  architecture:
    discovery: cross_system_and_trust_boundaries
    planning_depth: ADR_and_execution_plan
    repository_scope_policy: fixed_governance_repository
    agents: [coordinator, explorers_for_all_components, architect, contract-auditor, security-reviewer_if_flagged, reviewer]
    capability_tier: high_reasoning
    tests: [invariant_validation, ADR_validation, compatibility_design]
    reviews: [architecture_review, security_review_if_flagged]
    recovery_evidence: architecture_rollback_strategy
    human_approvals: [architecture_owner]
  data/schema migration:
    discovery: data_owner_schema_volume_and_failure_modes
    planning_depth: staged_migration_and_rollback_plan
    repository_scope_policy: affected_components
    agents: [coordinator, explorer_by_component, architect, security-reviewer_if_sensitive, implementer, test-runner, reviewer]
    capability_tier: high_reasoning
    tests: [forward_migration, rollback_or_compensation, data_integrity]
    reviews: [architecture_review, data_owner_review, security_review_if_sensitive]
    recovery_evidence: mandatory
    human_approvals: [data_owner, architecture_owner]
  security/auth/tenant:
    discovery: trust_boundary_and_negative_paths
    planning_depth: threat_model_and_execution_plan
    repository_scope_policy: affected_components
    agents: [coordinator, explorer_by_component, architect, security-reviewer, implementer, test-runner, reviewer]
    capability_tier: high_reasoning
    tests: [negative_authorization, replay, tenant_isolation, secret_absence]
    reviews: [security_review, architecture_review, independent_review]
    recovery_evidence: mandatory
    human_approvals: [security_owner]
  MCP change:
    discovery: registration_catalog_schema_scope_annotation_and_error_paths
    planning_depth: contract_plan
    repository_scope_policy: one_affected_component
    agents: [coordinator, explorer-laravel, architect_if_write_or_scope, contract-auditor, security-reviewer_if_write_or_scope, implementer, test-runner, reviewer]
    capability_tier: high_reasoning
    tests: [MCP_runtime_catalog_parity, schema_scope_annotations, approval_reauth_idempotency, error_taxonomy]
    reviews: [contract_review, security_review_if_write_or_scope]
    recovery_evidence: required_for_MCP_writes
    human_approvals: [MCP_contract_owner]
  release/readiness:
    discovery: immutable_release_tuple_and_all_gates
    planning_depth: release_evidence_manifest
    repository_scope_policy: none
    artifact_write_scope: [release_evidence]
    agents: [coordinator, contract-auditor, security-reviewer_if_flagged, release-reviewer]
    capability_tier: high_reasoning
    tests: [all_component_gates, compatibility_matrix, contract_locks, generated_drift]
    reviews: [release_review, contract_review, security_review_if_required]
    recovery_evidence: deployment_order_and_checkpoints
    human_approvals: [release_owner]
  incident/recovery:
    discovery: preserve_evidence_and_bound_blast_radius
    planning_depth: severity_specific
    repository_scope_policy: none
    agents: [coordinator, incident-investigator, explorer_by_component, security-reviewer_if_credential_or_trust_boundary]
    capability_tier: high_reasoning
    tests: [state_reconciliation, regression_gates]
    reviews: [incident_owner, security_review_if_triggered]
    recovery_evidence: mandatory
    human_approvals: [incident_commander_for_state_change, customer_communication_owner]
risk_overrides:
  mutation:
    add_agents: [security-reviewer]
    add_tests: [mutation_safety_matrix, concurrency, idempotency, replay, recovery]
    stop_if: [mutation_family_unclassified, recovery_unknown]
  public contract:
    add_agents: [architect, contract-auditor]
    add_tests: [provider_consumer_compatibility]
  cross-repository:
    add_agents: [architect, contract-auditor]
    add_tests: [immutable_contract_lock, compatibility_matrix]
  credential:
    add_agents: [security-reviewer]
    stop_if: [credential_material_required_by_agent]
  PII:
    add_agents: [security-reviewer]
  authentication:
    add_agents: [security-reviewer, architect]
  authorization:
    add_agents: [security-reviewer]
  tenant isolation:
    add_agents: [security-reviewer, architect]
  MCP:
    add_agents: [contract-auditor]
    add_tests: [MCP_runtime_catalog_parity]
  billing:
    add_agents: [security-reviewer]
  customer communication:
    add_agents: [security-reviewer]
    add_approvals: [customer_communication_owner]
  destructive/irreversible:
    add_agents: [architect, security-reviewer]
    add_approvals: [explicit_human_approval]
  mobile signing:
    add_agents: [security-reviewer, release-reviewer]
    stop_if: [signing_credentials_required]
  connector cutover:
    add_agents: [architect, contract-auditor, release-reviewer]
