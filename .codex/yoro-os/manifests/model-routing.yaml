schema_version: "0.1"
document_type: yoro_model_routing
architecture_depends_on_model_identity: false
tiers:
  high_reasoning:
    current_model: gpt-5.6-sol
    reasoning_effort: high
    required_for:
      - architecture
      - security_review
      - contract_ownership
      - migration_architecture
      - high_blast_radius
    substitution_policy: fail_closed
  standard_implementation:
    current_model: gpt-5.6-terra
    reasoning_effort: medium
    required_for:
      - bounded_implementation
      - debugging
      - review
    substitution_policy: equal_or_higher_only
  efficient_read:
    current_model: gpt-5.6-terra
    reasoning_effort: low
    required_for:
      - exploration
      - deterministic_validation
      - inventory
    substitution_policy: equal_or_higher_only
environment_override:
  mechanism: "In the canonical yoro-codex-os checkout, pass an alternate YAML file to its scripts/render-agent-models.sh; an installed component must not infer a local script path. Governance records continue to reference tiers."
  required_keys:
    - tiers.high_reasoning.current_model
    - tiers.standard_implementation.current_model
    - tiers.efficient_read.current_model
  unknown_or_unavailable_required_tier: stop_before_application_write
