schema_version: "0.3"
document_type: yoro_governance_installation
os_version: "0.1.2"
preview_source_marker: UNCOMMITTED-PREVIEW
provenance:
  adopted_source: derive_git_HEAD
  explicit_sha_behavior: verify_equals_actual_HEAD
  clean_policy: no_tracked_or_untracked_changes
  version_source: VERSION_from_same_tree
ownership_types:
  - generated_full_file
  - generated_block
  - component_owned
  - canonical_source_only
  - read_only_evidence_reference
merge_strategies: [replace_exact, marker_merge, preserve]
drift_policies: [fail_closed, component_owned, not_installed]
rollback_policies: [restore_previous_managed_state, preserve, not_applicable]
markers:
  agents_begin: "<!-- BEGIN YORO CODEX OS GENERATED -->"
  agents_end: "<!-- END YORO CODEX OS GENERATED -->"
  gitignore_begin: "# BEGIN YORO CODEX OS MANAGED TRACKING"
  gitignore_end: "# END YORO CODEX OS MANAGED TRACKING"
managed_paths:
  - id: root_instructions
    ownership: generated_block
    source: templates/repository/AGENTS.shared.md
    destination: AGENTS.md
    components: [yoro-ai-api, yoro-ai-core, yoro-apps]
    merge_strategy: marker_merge
    drift_policy: fail_closed
    rollback_policy: restore_previous_managed_state
    git_tracking_required: true
  - id: narrow_codex_tracking
    ownership: generated_block
    source: templates/repository/gitignore.yoro-block
    destination: .gitignore
    components: [yoro-ai-api, yoro-ai-core, yoro-apps]
    merge_strategy: marker_merge
    drift_policy: fail_closed
    rollback_policy: restore_previous_managed_state
    git_tracking_required: true
  - id: custom_agents
    ownership: generated_full_file
    source_root: .codex/agents
    destination_root: .codex/agents
    destination_prefix: yoro-
    files: [architect.toml, contract-auditor.toml, coordinator.toml, debugger.toml, explorer-flutter.toml, explorer-laravel.toml, explorer-wordpress.toml, implementer.toml, incident-investigator.toml, release-reviewer.toml, reviewer.toml, security-reviewer.toml, test-runner.toml]
    components: [yoro-ai-api, yoro-ai-core, yoro-apps]
    merge_strategy: replace_exact
    drift_policy: fail_closed
    rollback_policy: restore_previous_managed_state
    git_tracking_required: true
  - id: skills
    ownership: generated_full_file
    source_root: .agents/skills
    destination_root: .agents/skills
    files:
      - yoro-architecture-change/SKILL.md
      - yoro-architecture-change/agents/openai.yaml
      - yoro-bug-fix/SKILL.md
      - yoro-bug-fix/agents/openai.yaml
      - yoro-cross-repo-contract-change/SKILL.md
      - yoro-cross-repo-contract-change/agents/openai.yaml
      - yoro-feature-delivery/SKILL.md
      - yoro-feature-delivery/agents/openai.yaml
      - yoro-flutter-api-change/SKILL.md
      - yoro-flutter-api-change/agents/openai.yaml
      - yoro-incident-response/SKILL.md
      - yoro-incident-response/agents/openai.yaml
      - yoro-mcp-change/SKILL.md
      - yoro-mcp-change/agents/openai.yaml
      - yoro-mutation-change/SKILL.md
      - yoro-mutation-change/agents/openai.yaml
      - yoro-release-readiness/SKILL.md
      - yoro-release-readiness/agents/openai.yaml
      - yoro-repository-adoption/SKILL.md
      - yoro-repository-adoption/agents/openai.yaml
      - yoro-security-change/SKILL.md
      - yoro-security-change/agents/openai.yaml
      - yoro-task-router/SKILL.md
      - yoro-task-router/agents/openai.yaml
      - yoro-workspace-discovery/SKILL.md
      - yoro-workspace-discovery/agents/openai.yaml
    components: [yoro-ai-api, yoro-ai-core, yoro-apps]
    merge_strategy: replace_exact
    drift_policy: fail_closed
    rollback_policy: restore_previous_managed_state
    git_tracking_required: true
  - id: runtime_governance_support
    ownership: generated_full_file
    source_root: .
    destination_root: .codex/yoro-os
    files:
      - {source: manifests/routing.yaml, destination: manifests/routing.yaml}
      - {source: manifests/routing-selectors.yaml, destination: manifests/routing-selectors.yaml}
      - {source: manifests/model-routing.yaml, destination: manifests/model-routing.yaml}
      - {source: manifests/mutation-safety.yaml, destination: manifests/mutation-safety.yaml}
      - {source: manifests/contract-locks.yaml, destination: manifests/contract-locks.yaml}
      - {source: manifests/components.yaml, destination: manifests/components.yaml}
      - {source: manifests/governance-installation.yaml, destination: manifests/governance-installation.yaml}
      - {source: manifests/task-handoff.yaml, destination: manifests/task-handoff.yaml}
      - {source: manifests/invariants.yaml, destination: manifests/invariants.yaml}
      - {source: manifests/adr-governance.yaml, destination: manifests/adr-governance.yaml}
      - {source: tests/routing/fixtures.yaml, destination: manifests/routing-fixtures.yaml}
      - {source: templates/adr/ADR-template.md, destination: templates/adr/ADR-template.md}
      - {source: templates/task-spec/task-spec.yaml, destination: templates/task-spec/task-spec.yaml}
      - {source: templates/task-handoff/execution-handoff.yaml, destination: templates/task-handoff/execution-handoff.yaml}
      - {source: templates/independent-review/independent-review.yaml, destination: templates/independent-review/independent-review.yaml}
      - {source: templates/release-evidence/release-evidence.yaml, destination: templates/release-evidence/release-evidence.yaml}
      - {source: templates/incident/incident-record.yaml, destination: templates/incident/incident-record.yaml}
      - {source: docs/contracts/app-gateway-reconciliation.md, destination: docs/contracts/app-gateway-reconciliation.md}
      - {source: docs/architecture/distribution.md, destination: docs/architecture/distribution.md}
      - {source: docs/governance/task-handoff.md, destination: docs/governance/task-handoff.md}
      - {source: docs/governance/task-routing.md, destination: docs/governance/task-routing.md}
      - {source: docs/governance/invariants.md, destination: docs/governance/invariants.md}
      - {source: docs/governance/adr-policy.md, destination: docs/governance/adr-policy.md}
      - {source: scripts/resolve-route.rb, destination: bin/resolve-route.rb}
      - {source: templates/repository/installed-README.md, destination: README.md}
    components: [yoro-ai-api, yoro-ai-core, yoro-apps]
    merge_strategy: replace_exact
    drift_policy: fail_closed
    rollback_policy: restore_previous_managed_state
    git_tracking_required: true
  - id: component_identity
    ownership: generated_full_file
    source: manifests/components.yaml
    destination: .codex/yoro-os/manifests/component.yaml
    components: [yoro-ai-api, yoro-ai-core, yoro-apps]
    merge_strategy: replace_exact
    drift_policy: fail_closed
    rollback_policy: restore_previous_managed_state
    git_tracking_required: true
  - id: installation_metadata
    ownership: generated_full_file
    source: generated
    destination: .codex/yoro-os/installation.yaml
    components: [yoro-ai-api, yoro-ai-core, yoro-apps]
    merge_strategy: replace_exact
    drift_policy: fail_closed
    rollback_policy: restore_previous_managed_state
    git_tracking_required: true
  - id: component_codex_config
    ownership: component_owned
    source: null
    destination: .codex/config.toml
    components: [yoro-ai-api, yoro-ai-core, yoro-apps]
    merge_strategy: preserve
    drift_policy: component_owned
    rollback_policy: preserve
    git_tracking_required: false
  - id: runtime_contracts
    ownership: read_only_evidence_reference
    source: executing_component
    destination: null
    components: [yoro-ai-api, yoro-ai-core, yoro-apps]
    merge_strategy: preserve
    drift_policy: not_installed
    rollback_policy: not_applicable
    git_tracking_required: false
components:
  yoro-ai-api:
    overlay: templates/component-overlays/yoro-ai-api.md
    default_enforcement: report-only
  yoro-ai-core:
    overlay: templates/component-overlays/yoro-ai-core.md
    default_enforcement: report-only
  yoro-apps:
    overlay: templates/component-overlays/yoro-apps.md
    default_enforcement: report-only
